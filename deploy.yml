name: deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '40 12 * * 6'   # 토 21:40 KST 당첨번호 갱신
    - cron: '10 1 * * 0'    # 일 10:10 KST 재시도
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 당첨번호 갱신
        run: |
          python scripts/update_draws.py
          git config user.name "draws-bot"
          git config user.email "draws-bot@users.noreply.github.com"
          git add data/draws.json || true
          if ! git diff --cached --quiet; then git commit -m "당첨번호 자동 업데이트" && git push; fi
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: QR·숫자인식 모듈 받기 (버전 고정)
        run: |
          mkdir -p /tmp/v && cd /tmp/v && npm init -y >/dev/null
          npm install --no-audit --no-fund tesseract.js@6.0.1 tesseract.js-core@6.1.2 jsqr@1.4.0 @tesseract.js-data/eng@1.0.0
          cd "$GITHUB_WORKSPACE"
          mkdir -p lib/tess/core lib/tess/lang
          cp /tmp/v/node_modules/jsqr/dist/jsQR.js lib/
          cp /tmp/v/node_modules/tesseract.js/dist/tesseract.min.js /tmp/v/node_modules/tesseract.js/dist/worker.min.js lib/tess/
          cp /tmp/v/node_modules/tesseract.js-core/tesseract-core-lstm.wasm.js /tmp/v/node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm.js lib/tess/core/
          python -c "import base64;d=open('/tmp/v/node_modules/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz','rb').read();open('lib/tess/lang/eng-traineddata.js','w').write('self.__ENG_B64=\"'+base64.b64encode(d).decode()+'\";')"
          mkdir -p _site && cp -r index.html sw.js manifest.webmanifest version.json icons data lib _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
